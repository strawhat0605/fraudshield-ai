<title id="title">FraudShield AI workflow</title><desc id="desc">Data input, validation, model training, evaluation and Streamlit scoring demo.</desc>
<rect width="1400" height="430" rx="24" fill="#f7fafc"/>
<text x="700" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324d">FraudShield AI — reproducible ML workflow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><rect x="35" y="145" width="235" height="145" rx="18" fill="#eaf2f8" stroke="#315b7d" stroke-width="3"/><text x="152" y="193" font-size="23" font-weight="700" fill="#17324d">1. Data input</text><text x="152" y="231" font-size="17" fill="#263746">Synthetic generator</text><text x="152" y="256" font-size="17" fill="#263746">or optional Kaggle CSV</text></g>
<g><rect x="315" y="145" width="235" height="145" rx="18" fill="#eaf2f8" stroke="#315b7d" stroke-width="3"/><text x="432" y="193" font-size="23" font-weight="700" fill="#17324d">2. Validation</text><text x="432" y="231" font-size="17" fill="#263746">Binary target checks</text><text x="432" y="256" font-size="17" fill="#263746">Numeric feature columns</text></g>
<g><rect x="595" y="145" width="235" height="145" rx="18" fill="#eaf2f8" stroke="#315b7d" stroke-width="3"/><text x="712" y="193" font-size="23" font-weight="700" fill="#17324d">3. Model training</text><text x="712" y="231" font-size="17" fill="#263746">Logistic Regression</text><text x="712" y="256" font-size="17" fill="#263746">Random Forest</text></g>
<g><rect x="875" y="145" width="235" height="145" rx="18" fill="#eaf2f8" stroke="#315b7d" stroke-width="3"/><text x="992" y="193" font-size="23" font-weight="700" fill="#17324d">4. Evaluation</text><text x="992" y="231" font-size="17" fill="#263746">Validation AP selection</text><text x="992" y="256" font-size="17" fill="#263746">Held-out test metrics</text></g>
<g><rect x="1155" y="145" width="210" height="145" rx="18" fill="#eaf2f8" stroke="#315b7d" stroke-width="3"/><text x="1260" y="193" font-size="23" font-weight="700" fill="#17324d">5. Demo output</text><text x="1260" y="231" font-size="17" fill="#263746">Saved model</text><text x="1260" y="256" font-size="17" fill="#263746">Streamlit risk score</text></g>
</g>
