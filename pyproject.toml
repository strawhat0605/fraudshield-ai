[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield-ai"
version = "0.1.0"
description = "Reproducible educational ML pipeline for imbalanced credit-card fraud detection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FraudShield AI contributors" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraudshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
